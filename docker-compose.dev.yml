# Geliştirme ortamı için sadece altyapı servisleri (API ve Worker lokalde debug modda çalıştırılabilir)
services:
  postgres:
    image: postgres:16-alpine
    container_name: otoedit-dev-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: otoedit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d otoedit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: otoedit-dev-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: otoedit-dev-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 36000000"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: otoedit-dev-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - dev_minio_data:/data

  python-worker:
    build:
      context: src/OtoEdit.PythonWorker
      dockerfile: Dockerfile
    container_name: otoedit-dev-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=otoedit
      - MINIO_SECURE=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-${GEMINI_API_KEY:-}}
      - GEMINI_TRANSCRIBE_RPM=${GEMINI_TRANSCRIBE_RPM:-3}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTIGRAVITY_PROXY_URL=${ANTIGRAVITY_PROXY_URL:-http://host.docker.internal:8045/v1}
      - ANTIGRAVITY_PROXY_KEY=${ANTIGRAVITY_PROXY_KEY:-}
      - ANTIGRAVITY_PROXY_MODEL=${ANTIGRAVITY_PROXY_MODEL:-gemini-3.8-flash-tiered}
      - STT_ENGINE_ORDER=${STT_ENGINE_ORDER:-gemini_transcribe,groq,proxy_gemini,local_whisper}
      - STT_CHUNK_MAX_SEC=${STT_CHUNK_MAX_SEC:-600}
      - LOCAL_WHISPER_MODEL=${LOCAL_WHISPER_MODEL:-large-v3-turbo}
      - VAD_THRESHOLD=${VAD_THRESHOLD:-0.4}
      - VAD_MIN_SILENCE_MS=${VAD_MIN_SILENCE_MS:-500}
      - JUMPCUT_ENGINE=${JUMPCUT_ENGINE:-v2}
      - JUMPCUT_MIN_SILENCE_MS=${JUMPCUT_MIN_SILENCE_MS:-700}
      - JUMPCUT_PAD_MS=${JUMPCUT_PAD_MS:-200}
      - JUMPCUT_WORD_GUARD_MS=${JUMPCUT_WORD_GUARD_MS:-150}
      - JUMPCUT_MIN_ISLAND_MS=${JUMPCUT_MIN_ISLAND_MS:-300}
      - TEMP_RETENTION=${TEMP_RETENTION:-after_job}
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - LD_LIBRARY_PATH=/usr/local/lib/python3.11/site-packages/nvidia/cublas/lib:/usr/local/lib/python3.11/site-packages/nvidia/cudnn/lib
    volumes:
      - ./src/OtoEdit.PythonWorker:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  dev_postgres_data:
  dev_minio_data:
